services:
  postgres:
    image: postgres:16-alpine
    container_name: cert-trainer-db
    environment:
      POSTGRES_USER: certtrainer
      POSTGRES_PASSWORD: certtrainer
      POSTGRES_DB: certtrainer
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U certtrainer']
      interval: 5s
      timeout: 5s
      retries: 5

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: cert-trainer-pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@certtrainer.dev
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - '5050:80'
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - pgadmin_data:/var/lib/pgadmin

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: cert-trainer-backend
    ports:
      - '3000:3000'
    environment:
      DATABASE_URL: postgresql://certtrainer:certtrainer@postgres:5432/certtrainer
      PORT: 3000
      FRONTEND_URL: http://localhost:8080
      # --- CI&T LLM proxy credentials — set in .env (gitignored) ---
      ANTHROPIC_AUTH_TOKEN: ${ANTHROPIC_AUTH_TOKEN}
      ANTHROPIC_BASE_URL: https://flow.ciandt.com/flow-llm-proxy/
      ANTHROPIC_MODEL: anthropic.claude-4-5-haiku
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://localhost:3000/auth/me || exit 1']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        VITE_API_URL: http://localhost:3000
    container_name: cert-trainer-frontend
    ports:
      - '8080:80'
    depends_on:
      backend:
        condition: service_healthy

volumes:
  postgres_data:
  pgadmin_data:
